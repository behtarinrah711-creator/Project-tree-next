name: Native shopping view migration

on:
  push:
    branches:
      - feature/shopping-view-and-wbs-polish

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shopping-view-and-wbs-polish
      - name: Make shopping a native WBS view
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/modules/wbs/homeView.js')
          s = p.read_text()

          old = "import { renderCostline } from './costlineView.js';\n"
          new = old + "import { SHOPPING_ICON, renderShoppingView } from './shoppingView.js';\n"
          if new not in s:
              if old not in s: raise SystemExit('renderCostline import anchor missing')
              s = s.replace(old, new, 1)

          old = "  { id:'costline', label:'Costline', icon: COSTLINE_ICON },\n];"
          new = "  { id:'costline', label:'Costline', icon: COSTLINE_ICON },\n  { id:'shopping', label:'لیست خرید', icon: SHOPPING_ICON },\n];"
          if "id:'shopping'" not in s:
              if old not in s: raise SystemExit('VIEWS anchor missing')
              s = s.replace(old, new, 1)

          old = "    + (currentView === 'costline' ? ' is-costline-view' : '');"
          new = "    + (currentView === 'costline' ? ' is-costline-view' : '')\n    + (currentView === 'shopping' ? ' is-shopping-view' : '');"
          if "currentView === 'shopping' ? ' is-shopping-view'" not in s:
              if old not in s: raise SystemExit('root class anchor missing')
              s = s.replace(old, new, 1)

          old = "  root.appendChild(tabs);\n\n  const toolbar = document.createElement('div');"
          new = "  root.appendChild(tabs);\n\n  if(currentView === 'shopping'){\n    root.appendChild(renderShoppingView(project));\n    return;\n  }\n\n  const toolbar = document.createElement('div');"
          if "root.appendChild(renderShoppingView(project));" not in s:
              if old not in s: raise SystemExit('shopping render anchor missing')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          git diff --check
          git diff -- src/modules/wbs/homeView.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/modules/wbs/homeView.js
          git commit -m "Make shopping a native WBS view"
          git push origin HEAD:feature/shopping-view-and-wbs-polish
