name: E2E browser checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Diagnose npm registry
        timeout-minutes: 2
        run: |
          node --version
          npm --version
          npm config get registry
          npm ping --loglevel verbose

      - name: Install dependencies
        timeout-minutes: 5
        env:
          NPM_CONFIG_FETCH_RETRIES: 1
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 1000
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 5000
          NPM_CONFIG_FETCH_TIMEOUT: 30000
        run: npm ci --no-audit --no-fund --loglevel verbose

      - name: Detect style-only pull request
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD | grep -Ev '^(src/styles/|\.github/workflows/e2e\.yml$)' | grep -q .; then
            echo 'run_browser=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_browser=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Chromium
        if: github.event_name != 'pull_request' || steps.scope.outputs.run_browser == 'true'
        timeout-minutes: 3
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: node --test $(find src -name '*.test.js' -print)

      - name: Run Playwright E2E
        if: github.event_name != 'pull_request' || steps.scope.outputs.run_browser == 'true'
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
