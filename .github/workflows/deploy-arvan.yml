name: Deploy saosa.ir to Arvan

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy isolated site]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: saosa-arvan-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure SSH
        env:
          SERVER_KEY: ${{ secrets.ARVAN_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SERVER_KEY" ]; then
            echo 'ARVAN_SSH_PRIVATE_KEY is missing' >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_KEY" > ~/.ssh/id_arvan
          chmod 600 ~/.ssh/id_arvan
          ssh-keyscan -T 10 -H 37.32.30.98 > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Publish static site and configure Nginx
        env:
          KAVENEGAR_API_KEY: ${{ secrets.KAVENEGAR_API_KEY }}
        run: |
          set -euo pipefail
          sed -i "s/__DEPLOYMENT_VERSION__/${GITHUB_SHA}/g" index.html src/bootstrap/cacheGuard.js
          if [ -z "$KAVENEGAR_API_KEY" ]; then
            echo 'KAVENEGAR_API_KEY is missing' >&2
            exit 1
          fi
          ssh -i ~/.ssh/id_arvan -o BatchMode=yes -o ConnectTimeout=10 root@37.32.30.98 'bash -s' <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          if ! command -v nginx >/dev/null 2>&1; then
            apt-get update
            apt-get install -y nginx
          fi
          install -d -m 755 /srv/saosa/releases /etc/nginx/sites-available /etc/nginx/sites-enabled
          cat > /etc/nginx/sites-available/saosa <<'NGINX'
          server {
              listen 80;
              server_name saosa.ir www.saosa.ir;
              root /srv/saosa/current;
              index index.html;
              client_max_body_size 6m;
              location /api/ {
                  proxy_pass http://127.0.0.1:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
              location = /index.html {
                  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
                  expires -1;
              }
              location ~* \.(?:js|css)$ {
                  add_header Cache-Control "no-cache, must-revalidate" always;
                  expires -1;
                  try_files $uri =404;
              }
              location / { try_files $uri $uri/ /index.html; }
          }
          NGINX
          ln -sfn /etc/nginx/sites-available/saosa /etc/nginx/sites-enabled/saosa
          rm -f /etc/nginx/sites-enabled/default
          nginx -t
          REMOTE
          release="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA:0:8}"
          ssh -i ~/.ssh/id_arvan -o BatchMode=yes root@37.32.30.98 "install -d -m 755 /srv/saosa/releases/$release"
          tar -czf - --exclude=.git --exclude=.github --exclude=node_modules \
            --exclude=tests --exclude=playwright-report --exclude=test-results \
            --exclude='*.test.js' . | \
            ssh -i ~/.ssh/id_arvan -o BatchMode=yes root@37.32.30.98 \
              "tar -xzf - -C /srv/saosa/releases/$release"
          ssh -i ~/.ssh/id_arvan -o BatchMode=yes root@37.32.30.98 \
            "umask 077; cat > /run/saosa-kavenegar-key" <<<"$KAVENEGAR_API_KEY"
          ssh -i ~/.ssh/id_arvan -o BatchMode=yes root@37.32.30.98 \
            "ln -sfn /srv/saosa/releases/$release /srv/saosa/current && bash /srv/saosa/current/server/ops/provision.sh /srv/saosa/current/server && nginx -t && systemctl enable --now nginx && systemctl reload nginx && curl -fsS -o /dev/null http://127.0.0.1/ && curl -fsS http://127.0.0.1/api/health"
