name: Deploy saosa.ir to Arvan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saosa-arvan-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prepare Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          architecture: x64

      - name: Build self-contained API runtime
        run: |
          set -euo pipefail
          npm --prefix server ci --omit=dev --include=optional --no-audit --no-fund
          install -d -m 755 server/runtime/bin
          install -m 755 "$(node -p 'process.execPath')" server/runtime/bin/node
          bash server/ops/check-runtime.sh "$GITHUB_WORKSPACE/server"
          npm --prefix server test

      - name: Configure SSH
        env:
          SERVER_KEY: ${{ secrets.ARVAN_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SERVER_KEY" ]; then
            echo 'ARVAN_SSH_PRIVATE_KEY is missing' >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_KEY" > ~/.ssh/id_arvan
          chmod 600 ~/.ssh/id_arvan
          ssh-keyscan -T 10 -H 37.32.30.98 > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Publish static site and configure Nginx
        env:
          KAVENEGAR_API_KEY: ${{ secrets.KAVENEGAR_API_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/stampDeploymentVersion.mjs "${DEPLOY_SHA}"
          if [ -z "$KAVENEGAR_API_KEY" ]; then
            echo 'KAVENEGAR_API_KEY is missing' >&2
            exit 1
          fi
          ssh -i ~/.ssh/id_arvan -o BatchMode=yes -o ConnectTimeout=10 root@37.32.30.98 'bash -s' <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          if command -v psql >/dev/null 2>&1 && ! runuser -u postgres -- psql -X -d postgres -Atqc 'SELECT 1'; then
            echo 'PostgreSQL preflight failed. Inspect filesystem usage and PostgreSQL service logs below.' >&2
            df -hP / /srv /var/lib/postgresql
            df -iP / /srv /var/lib/postgresql
            findmnt -T /var/lib/postgresql -o TARGET,FSTYPE,OPTIONS
            journalctl -u 'postgresql*' --since '10 minutes ago' -n 40 --no-pager || true
            exit 1
          fi
          if ! command -v nginx >/dev/null 2>&1; then
            apt-get update
            apt-get install -y nginx
          fi
          install -d -m 755 /srv/saosa/releases /etc/nginx/sites-available /etc/nginx/sites-enabled
          cat > /etc/nginx/sites-available/saosa <<'NGINX'
          server {
              listen 80;
              server_name saosa.ir www.saosa.ir;
              root /srv/saosa/current;
              index index.html;
              client_max_body_size 26m;
              location ^~ /server/ { return 404; }
              location /api/ {
                  proxy_pass http://127.0.0.1:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
              location = /index.html {
                  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
                  expires -1;
              }
              location ~* \.(?:js|css|woff|woff2)$ {
                  add_header Cache-Control "no-cache, must-revalidate" always;
                  expires -1;
                  try_files $uri =404;
              }
              location / { try_files $uri $uri/ /index.html; }
          }
          NGINX
          ln -sfn /etc/nginx/sites-available/saosa /etc/nginx/sites-enabled/saosa
          rm -f /etc/nginx/sites-enabled/default
          nginx -t
          REMOTE
          ssh_arvan=(ssh -i ~/.ssh/id_arvan -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 root@37.32.30.98)
          node_version="$(node -p 'process.version')"
          lock_hash="$(sha256sum server/package-lock.json | cut -d ' ' -f 1)"
          runtime="/srv/saosa/runtimes/linux-x64-$node_version-$lock_hash"
          release="/srv/saosa/releases/$(date -u +%Y%m%d%H%M%S)-${DEPLOY_SHA:0:8}"
          "${ssh_arvan[@]}" 'df -hP /srv/saosa; df -iP /srv/saosa'
          if ! "${ssh_arvan[@]}" "test -x '$runtime/runtime/bin/node' && test -d '$runtime/node_modules'"; then
            if "${ssh_arvan[@]}" bash -s -- "$runtime" "$node_version" "$lock_hash" <<'REMOTE'
          set -euo pipefail
          runtime="$1"
          current="$(readlink -e /srv/saosa/current)/server"
          test "$(sha256sum "$current/package-lock.json" | cut -d ' ' -f 1)" = "$3"
          test "$("$current/runtime/bin/node" --version)" = "$2"
          bash "$current/ops/check-runtime.sh" "$current"
          install -d /srv/saosa/runtimes
          stage="$(mktemp -d /srv/saosa/runtimes/.seed.XXXXXX)"
          trap 'rm -rf -- "$stage"' EXIT
          cp -a "$(readlink -f "$current/runtime")" "$stage/runtime"
          cp -a "$(readlink -f "$current/node_modules")" "$stage/node_modules"
          chmod 755 "$stage"
          mv -T "$stage" "$runtime"
          REMOTE
            then
              echo 'Reused the active release runtime.'
            else
              archive="$RUNNER_TEMP/saosa-runtime.tar.gz"
              tar -C server -czf "$archive" runtime node_modules
              echo "Uploading runtime: $(wc -c < "$archive") bytes"
              time timeout 8m "${ssh_arvan[@]}" "set -e; install -d /srv/saosa/runtimes; stage=\$(mktemp -d /srv/saosa/runtimes/.upload.XXXXXX); trap 'rm -rf -- \"\$stage\"' EXIT; tar -xzf - -C \"\$stage\"; chmod 755 \"\$stage\"; mv -T \"\$stage\" '$runtime'" < "$archive"
            fi
          else
            echo 'Using cached runtime on Arvan.'
          fi
          archive="$RUNNER_TEMP/saosa-release.tar.gz"
          tar -czf "$archive" --exclude=.git --exclude=.github --exclude=./node_modules \
            --exclude=./server/node_modules --exclude=./server/runtime \
            --exclude=tests --exclude=playwright-report --exclude=test-results --exclude='*.test.js' .
          echo "Uploading application: $(wc -c < "$archive") bytes"
          time timeout 3m "${ssh_arvan[@]}" "set -e; install -d '$release'; tar -xzf - -C '$release'; ln -s '$runtime/runtime' '$release/server/runtime'; ln -s '$runtime/node_modules' '$release/server/node_modules'" < "$archive"
          "${ssh_arvan[@]}" "umask 077; cat > /run/saosa-kavenegar-key" <<<"$KAVENEGAR_API_KEY"
          "${ssh_arvan[@]}" "bash '$release/server/ops/activate-release.sh' '$release'"
