name: Unpack project archive

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project archive into repository root
        shell: bash
        run: |
          set -euo pipefail
          archive="Project-tree-next-isolated-ready.zip"
          if [ ! -f "$archive" ]; then
            echo "Archive not present; nothing to do."
            exit 0
          fi

          rm -rf .unpack-project
          mkdir .unpack-project
          unzip -q "$archive" -d .unpack-project

          src=".unpack-project/Project-tree-next"
          if [ ! -d "$src" ]; then
            echo "Expected folder $src was not found in archive."
            exit 1
          fi

          shopt -s dotglob nullglob
          cp -a "$src"/* ./

          # Do not let this workflow push workflow-file changes; GitHub blocks
          # workflow-created commits from creating/updating .github/workflows.
          # Those files will be restored separately through the GitHub connector.
          rm -rf .github/workflows
          mkdir -p .github/workflows
          git checkout -- .github/workflows/unpack-project.yml

          rm -rf .unpack-project "$archive"

      - name: Commit unpacked project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: unpack isolated Project-tree-next"
          git push origin main
