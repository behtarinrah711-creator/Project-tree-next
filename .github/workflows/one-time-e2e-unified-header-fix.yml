name: One-time E2E unified header selector cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-e2e-unified-header-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace removed hamburger selector in E2E tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(grep -RIl --include='*.spec.js' '#hamburgerBtn' tests/e2e || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No stale #hamburgerBtn E2E selectors found.'
            exit 0
          fi
          printf 'Updating %s\n' "${files[@]}"
          sed -i 's/#hamburgerBtn/#topbarTitle/g' "${files[@]}"
          if grep -RIn --include='*.spec.js' '#hamburgerBtn' tests/e2e; then
            echo 'Stale hamburger selector still exists.' >&2
            exit 1
          fi
          git diff --check
          git diff -- tests/e2e
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/e2e; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e
          git commit -m 'test: align E2E project drawer with unified header'
          git push origin HEAD:main
