name: ERPNext pilot host check

on:
  workflow_dispatch:

permissions: {}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check Arvan host resources
        env:
          SERVER_KEY: ${{ secrets.ARVAN_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_KEY" > ~/.ssh/id_arvan
          chmod 600 ~/.ssh/id_arvan
          trap 'rm -f ~/.ssh/id_arvan' EXIT
          ssh-keyscan -T 10 -H 37.32.30.98 > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_arvan -o BatchMode=yes -o ConnectTimeout=10 root@37.32.30.98 'bash -s' <<'REMOTE'
          set -euo pipefail
          uname -sm
          nproc
          free -m
          df -hP / /srv
          if command -v docker >/dev/null 2>&1; then
            docker version --format '{{.Server.Version}}'
            docker compose version
          else
            echo 'Docker is not installed'
          fi
          REMOTE
